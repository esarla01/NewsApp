<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aries News</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .news-card { display: grid; grid-template-columns: 140px 1fr; gap: 1rem; }
    .news-card img { width: 140px; border-radius: 0.25rem; }
    .news-card h3 { margin-bottom: 0.5rem; font-size: 1.15rem; }
    .meta { font-size: 0.85rem; color: var(--pico-muted-color); margin-bottom: 0.25rem; }
    .badge { display: inline-block; padding: 0.1rem 0.7rem; border-radius: 1rem;
             font-size: 0.8rem; font-weight: 600; color: #fff; }
    .badge.positive { background: #2e7d32; }
    .badge.neutral { background: #6b7280; }
    .badge.negative { background: #c62828; }
    .error { color: #c62828; }
    @media (max-width: 576px) { .news-card { grid-template-columns: 1fr; } }
    html { scroll-behavior: smooth; }
    #history { max-height: 70vh; overflow-y: auto; padding-right: 0.5rem; }
    .back-to-top { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.4rem 0.8rem;
                   border-radius: 50%; background: var(--pico-primary-background);
                   color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Show Pico's spinner (aria-busy) on the button behind each htmx request.
    function requestButton(event) {
      const element = event.detail.elt;
      return element.matches("button") ? element : element.querySelector("button");
    }
    document.addEventListener("htmx:beforeRequest", (e) => requestButton(e)?.setAttribute("aria-busy", "true"));
    document.addEventListener("htmx:afterRequest", (e) => requestButton(e)?.removeAttribute("aria-busy"));
  </script>
</body>
</html>
