{# Search page (GET /). The form requests /partials/search and htmx swaps the response into #results. #}
{% extends "base.html" %}

{% block content %}
<header>
  <h1>Search</h1>
  <p>Search recent Guardian articles, then get an AI summary and sentiment for any of them.</p>
</header>

<section>
  <form hx-get="/partials/search" hx-target="#results" hx-disabled-elt="find button">
    <fieldset role="group">
      <input type="search" name="q" placeholder="Search the news, e.g. climate" aria-label="Search" required>
      <button type="submit">Search</button>
      <button type="reset" class="secondary" onclick="document.getElementById('results').innerHTML = ''">
        Clear
      </button>
    </fieldset>
    <div class="grid">
      <label>
        Section
        <select name="section">
          <option value="">All sections</option>
          {% for value, label in sections.items() %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <label>From <input type="date" name="from_date"></label>
      <label>To <input type="date" name="to_date"></label>
      <label>
        Sort by
        <select name="order_by">
          <option value="newest">Newest</option>
          <option value="relevance">Relevance</option>
        </select>
      </label>
    </div>
    <label>
      <input type="checkbox" name="smart" role="switch">
      Smart search (AI): ask in plain English, e.g. "good news about renewable energy this week".
      The AI chooses the filters.
    </label>
  </form>
  <div id="results"></div>
</section>
{% endblock %}
